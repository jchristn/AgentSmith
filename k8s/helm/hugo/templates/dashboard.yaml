{{- $ns := include "hugo.namespace" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hugo-dashboard
  namespace: {{ $ns }}
  labels:
    {{- include "hugo.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hugo-dashboard
  namespace: {{ $ns }}
  labels:
    {{- include "hugo.labels" . | nindent 4 }}
    app.kubernetes.io/name: hugo-dashboard
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: hugo-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hugo-dashboard
        app.kubernetes.io/component: dashboard
    spec:
      serviceAccountName: hugo-dashboard
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.dashboard.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- include "hugo.topologySpread" (dict "constraints" . "app" "hugo-dashboard") | nindent 8 }}
      {{- end }}
      containers:
        - name: dashboard
          image: {{ include "hugo.image" (dict "root" . "name" "hugo-dashboard") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: HUGO_API_URL
              value: ""
            - name: HUGO_API_UPSTREAM
              value: {{ default (printf "http://hugo-server.%s.svc.cluster.local:8800" $ns) .Values.dashboard.apiUpstream }}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETGID", "SETUID", "NET_BIND_SERVICE"]
          readinessProbe:
            exec:
              command: ["curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/health"]
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 2
            successThreshold: 2
          livenessProbe:
            exec:
              command: ["curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/health"]
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 2
            successThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: hugo-dashboard
  namespace: {{ $ns }}
  labels:
    {{- include "hugo.labels" . | nindent 4 }}
    app.kubernetes.io/name: hugo-dashboard
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hugo-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
