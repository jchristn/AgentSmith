# Prometheus: scrapes the Hugo server pod by pod IP (config/prometheus.yaml). Seven days or 1 GB of data, whichever
# comes first, on a 2 GiB volume. Third-party images have no curl (D-037), so the probes are kubelet HTTP probes on
# the same 5 second period with two failures to go unhealthy.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hugo-prometheus
  labels:
    app.kubernetes.io/name: hugo-prometheus
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hugo-prometheus
  labels:
    app.kubernetes.io/name: hugo-prometheus
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hugo-prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hugo-prometheus
        app.kubernetes.io/component: observability
    spec:
      serviceAccountName: hugo-prometheus
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.4
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yaml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --storage.tsdb.retention.size=1GB
            - --enable-feature=exemplar-storage
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 2
      volumes:
        - name: config
          configMap:
            name: hugo-prometheus-config
        - name: data
          persistentVolumeClaim:
            claimName: hugo-prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: hugo-prometheus
  labels:
    app.kubernetes.io/name: hugo-prometheus
spec:
  selector:
    app.kubernetes.io/name: hugo-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
