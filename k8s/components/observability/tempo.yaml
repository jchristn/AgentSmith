# Tempo: stores the traces Alloy forwards over OTLP (config/tempo.yaml). 24 hours of retention on a 2 GiB volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hugo-tempo
  labels:
    app.kubernetes.io/name: hugo-tempo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hugo-tempo
  labels:
    app.kubernetes.io/name: hugo-tempo
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hugo-tempo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hugo-tempo
        app.kubernetes.io/component: observability
    spec:
      serviceAccountName: hugo-observability
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tempo
          image: grafana/tempo:2.6.1
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/tempo/tempo.yaml
          ports:
            - name: http
              containerPort: 3200
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
              readOnly: true
            - name: data
              mountPath: /var/tempo
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 2
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 2
      volumes:
        - name: config
          configMap:
            name: hugo-tempo-config
        - name: data
          persistentVolumeClaim:
            claimName: hugo-tempo
---
apiVersion: v1
kind: Service
metadata:
  name: hugo-tempo
  labels:
    app.kubernetes.io/name: hugo-tempo
spec:
  selector:
    app.kubernetes.io/name: hugo-tempo
  ports:
    - name: http
      port: 3200
      targetPort: http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
