# Grafana: provisioned datasources (UIDs prometheus, tempo, loki) and the Hugo dashboards in folder Hugo, the same
# provisioning as docker/compose.yaml. Everything is provisioned, so Grafana keeps no state worth a volume.
# The admin user is admin; the password is grafana-admin-password in Secret hugo-secrets. GF_SERVER_ROOT_URL
# matches the port-forward default; patch it together with HUGO_GRAFANA_URL when Grafana is exposed elsewhere.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hugo-grafana
  labels:
    app.kubernetes.io/name: hugo-grafana
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hugo-grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hugo-grafana
        app.kubernetes.io/component: observability
    spec:
      serviceAccountName: hugo-observability
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana-oss:12.1.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hugo-secrets
                  key: grafana-admin-password
            - name: GF_SERVER_ROOT_URL
              value: http://127.0.0.1:3000
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /etc/grafana/dashboards/hugo/hugo-overview.json
            - name: GF_LOG_LEVEL
              value: warn
            # Grafana 12 installs bundled plugins at startup; the Hugo dashboards need only built-in panels.
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /etc/grafana/grafana.ini
              subPath: grafana.ini
              readOnly: true
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/dashboards/hugo
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: "2"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 4
            failureThreshold: 2
      volumes:
        - name: config
          configMap:
            name: hugo-grafana-config
        - name: datasources
          configMap:
            name: hugo-grafana-datasources
        - name: dashboard-provider
          configMap:
            name: hugo-grafana-dashboard-provider
        - name: dashboards
          projected:
            sources:
              - configMap:
                  name: hugo-grafana-dashboard-agent
              - configMap:
                  name: hugo-grafana-dashboard-control-plane
              - configMap:
                  name: hugo-grafana-dashboard-database
              - configMap:
                  name: hugo-grafana-dashboard-http
              - configMap:
                  name: hugo-grafana-dashboard-integrations
              - configMap:
                  name: hugo-grafana-dashboard-logs
              - configMap:
                  name: hugo-grafana-dashboard-models
              - configMap:
                  name: hugo-grafana-dashboard-overview
              - configMap:
                  name: hugo-grafana-dashboard-protocols
              - configMap:
                  name: hugo-grafana-dashboard-security
              - configMap:
                  name: hugo-grafana-dashboard-tools
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hugo-grafana
  labels:
    app.kubernetes.io/name: hugo-grafana
spec:
  selector:
    app.kubernetes.io/name: hugo-grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
