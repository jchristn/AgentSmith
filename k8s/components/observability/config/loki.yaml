# Loki configuration for Garrison: single binary, filesystem storage, 72 hours of retention. Shared by
# k8s/components/observability, the Helm chart (mirrored copy, diffed in CI), and the Docker Compose
# observability profile (mounted from here).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  retention_period: 72h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_query_lookback: 72h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 32

pattern_ingester:
  enabled: false

analytics:
  reporting_enabled: false
