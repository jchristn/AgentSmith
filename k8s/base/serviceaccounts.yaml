# Neither Hugo pod talks to the Kubernetes API of the cluster it runs in, so neither mounts a token. The Kubernetes
# connector reaches clusters with a kubeconfig or token stored as a Hugo credential, never with these accounts.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hugo-server
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hugo-dashboard
automountServiceAccountToken: false
