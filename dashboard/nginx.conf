# Hugo dashboard. Serves the single-page app and proxies the Hugo server (REST, MCP, OpenAPI) so the browser uses
# one origin. /etc/nginx/hugo-upstream.inc is written at container start from HUGO_API_UPSTREAM
# (default http://hugo-server:8800). Buffering is off on every proxied location so Server-Sent Events (chat streams,
# the /v1.0/api/events feed, MCP streamable HTTP) reach the browser as they are produced.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/hugo-upstream.inc;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    location = /config.js {
        add_header Cache-Control "no-store";
        try_files /config.js =404;
    }

    location /v1.0/ {
        proxy_pass $hugo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 64m;
    }

    location /mcp {
        proxy_pass $hugo_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 16m;
    }

    location = /openapi.json {
        proxy_pass $hugo_api;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
