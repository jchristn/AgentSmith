name: Build and test

on:
  push:
  pull_request:

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Product version mirrors
        run: scripts/check-version-mirrors.sh
      - name: Reviewed dependency pins
        run: scripts/check-package-pins.sh
      - name: Grafana dashboard mirrors
        run: scripts/check-grafana-mirror.sh

  dotnet:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hugo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Em-dash guard
        run: scripts/check-em-dash.sh
      - name: Restore
        run: dotnet restore src/Hugo.sln
      - name: Build
        run: dotnet build src/Hugo.sln --no-restore
      - name: Touchstone (SQLite)
        run: dotnet run --project src/Test.Automated -f net10.0 -- --providers sqlite --results results-sqlite.json
      - name: Touchstone (PostgreSQL)
        env:
          HUGO_TEST_POSTGRES: "Host=127.0.0.1;Port=5432;Username=postgres;Password=postgres;Database=hugo_test"
        run: dotnet run --project src/Test.Automated -f net10.0 -- --providers postgresql --results results-postgresql.json
      - name: xUnit
        run: dotnet test src/Test.Xunit -f net10.0
      - name: NUnit
        run: dotnet test src/Test.Nunit -f net10.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: results-*.json

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-visual
          path: |
            dashboard/test-results/
            dashboard/playwright-report/

  sdks:
    runs-on: ubuntu-latest
    needs: dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start Hugo server
        env:
          HUGO_ADMIN_API_KEY: hugo-ci-admin-key-not-for-production
          HUGO_MASTER_KEY: aHVnby1jaS1tYXN0ZXIta2V5LW5vdC1mb3ItcHJvZHVjdGlvbg==
        run: |
          dotnet run --project src/Hugo.Server -f net10.0 > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8800/v1.0/api/health && break; sleep 2; done
      - name: SDK harnesses and coverage check
        env:
          HUGO_ADMIN_API_KEY: hugo-ci-admin-key-not-for-production
        run: sdk/scripts/run-harnesses.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdk-server-log
          path: server.log
