# Grafana settings that have no GF_* environment override. Grafana only maps GF_<SECTION>_<KEY> variables onto
# keys that already exist in an ini file, and feature toggles are not listed in defaults.ini, so they live here.
# Mounted as /etc/grafana/grafana.ini (the image's GF_PATHS_CONFIG). Everything else stays in the GF_* environment.

[feature_toggles]
# Grafana 13 enables splashScreen by default: a "What's new" modal (led by the Grafana Assistant announcement) on
# each user's first sign-in. The dismissal is kept in Grafana's database, which is an emptyDir in Kubernetes, so the
# modal would come back after every pod restart.
splashScreen = false
