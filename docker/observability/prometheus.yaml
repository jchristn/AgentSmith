# Prometheus configuration for the Hugo Docker Compose stack. hugo-server serves /metrics on its REST port (8800)
# on the Compose network only; the port is never published with /metrics exposed to the internet.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  # Keep the underscore metric names the Grafana dashboards use.
  metric_name_validation_scheme: legacy

scrape_configs:
  - job_name: hugo-server
    metrics_path: /metrics
    static_configs:
      - targets: ["hugo-server:8800"]
        labels:
          component: server

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
