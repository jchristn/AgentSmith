# Hugo on Docker Compose: the server, the dashboard, and the observability stack (Prometheus, Tempo, Loki, Alloy,
# Grafana). SQLite is the default database; add the postgres profile to run PostgreSQL instead.
#
#   cd docker
#   ./start.sh                    # creates .env with generated keys, then starts the stack
#   (plain "docker compose up -d" also works, using development keys that the server warns about)
#   docker compose up -d --build
#   docker compose --profile postgres up -d --build       # PostgreSQL instead of SQLite (also set HUGO_DB_TYPE)
#
# Dashboard http://127.0.0.1:8801 (tenant default, anderson@hugo.local / password, change it at first login).
# REST, MCP (/mcp), and A2A (/v1.0/a2a) http://127.0.0.1:8800. Grafana http://127.0.0.1:3000 (admin / admin).
# Prometheus http://127.0.0.1:9090. Tempo http://127.0.0.1:3200. Loki http://127.0.0.1:3100.
#
# Host ports bind 127.0.0.1 only and can be changed in .env. Third-party images are pinned. update.sh / update.bat
# pull the published images and recreate the stack without touching data; factory/reset.sh / reset.bat wipe it.

name: 'hugo'

services:

  # ------------------------------------------------------------------
  # PostgreSQL (optional, profile "postgres").
  # ------------------------------------------------------------------
  hugo-postgres:
    container_name: 'hugo-postgres'
    image: 'postgres:16.4-alpine'
    profiles: ['postgres']
    restart: 'unless-stopped'
    environment:
      POSTGRES_DB: 'hugo'
      POSTGRES_USER: 'hugo'
      POSTGRES_PASSWORD: '${HUGO_DB_PASSWORD:-hugo}'
    volumes:
      - hugo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U hugo -d hugo']
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 30s

  # ------------------------------------------------------------------
  # Observability.
  # ------------------------------------------------------------------
  hugo-prometheus:
    container_name: 'hugo-prometheus'
    image: 'prom/prometheus:v3.5.4'
    restart: 'unless-stopped'
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--enable-feature=exemplar-storage'
    ports:
      - '127.0.0.1:${HUGO_PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - hugo-prometheus-data:/prometheus
    healthcheck:
      # Third-party image without curl: wget is used (D-037).
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 20s

  hugo-tempo:
    container_name: 'hugo-tempo'
    image: 'grafana/tempo:2.6.1'
    restart: 'unless-stopped'
    command: ['-config.file=/etc/tempo/tempo.yaml']
    ports:
      - '127.0.0.1:${HUGO_TEMPO_PORT:-3200}:3200'
    volumes:
      - ./observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - hugo-tempo-data:/var/tempo
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3200/ready']
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 30s

  hugo-loki:
    container_name: 'hugo-loki'
    image: 'grafana/loki:3.5.5'
    restart: 'unless-stopped'
    command: ['-config.file=/etc/loki/loki.yaml']
    ports:
      - '127.0.0.1:${HUGO_LOKI_PORT:-3100}:3100'
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml:ro
      - hugo-loki-data:/loki
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3100/ready']
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 30s

  hugo-alloy:
    container_name: 'hugo-alloy'
    image: 'grafana/alloy:v1.10.2'
    restart: 'unless-stopped'
    command: ['run', '--server.http.listen-addr=0.0.0.0:12345', '--storage.path=/var/lib/alloy/data', '/etc/alloy/config.alloy']
    volumes:
      - ./observability/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - hugo-alloy-data:/var/lib/alloy/data
    depends_on:
      hugo-tempo:
        condition: service_healthy
      hugo-loki:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:12345/-/ready || (exec 3<>/dev/tcp/127.0.0.1/12345)']
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 20s

  # ------------------------------------------------------------------
  # Hugo server: REST, MCP, A2A, and OpenAI-compatible surfaces on 8800.
  # ------------------------------------------------------------------
  hugo-server:
    container_name: 'hugo-server'
    image: 'jchristn77/hugo-server:v0.1.0-alpha'
    build:
      context: '..'
      dockerfile: 'src/Hugo.Server/Dockerfile'
    restart: 'unless-stopped'
    ports:
      - '127.0.0.1:${HUGO_REST_PORT:-8800}:8800'
    environment:
      HUGO_SETTINGS_FILE: '/app/config/hugo.json'
      HUGO_REST_HOSTNAME: '0.0.0.0'
      HUGO_DB_TYPE: '${HUGO_DB_TYPE:-Sqlite}'
      HUGO_DB_SERVER: 'hugo-postgres'
      HUGO_DB_PASSWORD: '${HUGO_DB_PASSWORD:-hugo}'
      HUGO_MASTER_KEY: '${HUGO_MASTER_KEY:-aHVnby1kZXZlbG9wbWVudC1tYXN0ZXIta2V5LW5vdC1mb3ItcHJvZHVjdGlvbg==}'
      HUGO_AUTH_SIGNING_KEY: '${HUGO_AUTH_SIGNING_KEY:-hugo-development-signing-key-not-for-production}'
      HUGO_OTLP_ENDPOINT: 'http://hugo-alloy:4317'
      HUGO_EXTERNAL_BASE_URL: '${HUGO_EXTERNAL_BASE_URL:-http://127.0.0.1:${HUGO_REST_PORT:-8800}}'
    volumes:
      - ./hugo/hugo.json:/app/config/hugo.json
      - hugo-data:/app/data
    depends_on:
      hugo-tempo:
        condition: service_healthy
      hugo-loki:
        condition: service_healthy
      hugo-alloy:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:8800/v1.0/api/health']
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 30s

  # ------------------------------------------------------------------
  # Dashboard: nginx serving the React console and proxying /v1.0, /mcp, and /openapi.json to the server.
  # ------------------------------------------------------------------
  hugo-dashboard:
    container_name: 'hugo-dashboard'
    image: 'jchristn77/hugo-dashboard:v0.1.0-alpha'
    build:
      context: '../dashboard'
    restart: 'unless-stopped'
    ports:
      - '127.0.0.1:${HUGO_DASHBOARD_PORT:-8801}:80'
    environment:
      HUGO_API_UPSTREAM: 'http://hugo-server:8800'
    depends_on:
      hugo-server:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1/health']
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 10s

  hugo-grafana:
    container_name: 'hugo-grafana'
    image: 'grafana/grafana-oss:12.1.1'
    restart: 'unless-stopped'
    ports:
      - '127.0.0.1:${HUGO_GRAFANA_PORT:-3000}:3000'
    environment:
      GF_SECURITY_ADMIN_USER: '${GF_SECURITY_ADMIN_USER:-admin}'
      GF_SECURITY_ADMIN_PASSWORD: '${GF_SECURITY_ADMIN_PASSWORD:-admin}'
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./observability/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/hugo.yaml:ro
      - ./observability/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/hugo.yaml:ro
      - ../assets/grafana:/etc/grafana/dashboards/hugo:ro
      - hugo-grafana-data:/var/lib/grafana
    depends_on:
      hugo-prometheus:
        condition: service_healthy
      hugo-tempo:
        condition: service_healthy
      hugo-loki:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 30s

volumes:
  hugo-data:
  hugo-postgres-data:
  hugo-prometheus-data:
  hugo-tempo-data:
  hugo-loki-data:
  hugo-alloy-data:
  hugo-grafana-data:
