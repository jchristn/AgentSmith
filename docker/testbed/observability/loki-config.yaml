# Minimal single-binary Loki for the Hugo observability testbed. Multi-tenant (auth_enabled), so every request must
# carry X-Scope-OrgID; the seed and the tests use tenant "hugo-testbed". Storage is the container filesystem.
auth_enabled: true

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: false
  allow_structured_metadata: true

ingester:
  lifecycler:
    final_sleep: 0s

analytics:
  reporting_enabled: false
