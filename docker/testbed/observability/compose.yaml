# Hugo observability testbed: Prometheus, Loki, and OpenSearch for the prometheus, loki, and elasticsearch connectors.
#
#   docker compose -f docker/testbed/observability/compose.yaml up -d --wait
#   HUGO_TESTBED=1 dotnet run --project src/Test.Automated -f net10.0 -- --suites testbed.observability
#   docker compose -f docker/testbed/observability/compose.yaml down -v
#
# Ports (loopback only):
#   Prometheus  127.0.0.1:28090  (scrapes itself; rules in testbed-rules.yml: one always-firing alert, one recording rule)
#   Loki        127.0.0.1:28100  (multi-tenant; use X-Scope-OrgID hugo-testbed; seeded with 40 lines in two streams)
#   OpenSearch  127.0.0.1:28992  (security plugin disabled; indexes hugo-logs-2026.10 (50 docs) and hugo-secret, alias hugo-alias)
#
# Each host port can be overridden (HUGO_TESTBED_PROMETHEUS_PORT, HUGO_TESTBED_LOKI_PORT, HUGO_TESTBED_OPENSEARCH_PORT);
# the test suites read the same variables. The Loki image has no shell, so its readiness is covered by the loki-seed
# service, which waits for /ready, pushes the lines, and reports healthy once they are queryable.

name: hugo-testbed-observability

services:
  prometheus:
    image: prom/prometheus:v3.7.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./testbed-rules.yml:/etc/prometheus/testbed-rules.yml:ro
    ports:
      - "127.0.0.1:${HUGO_TESTBED_PROMETHEUS_PORT:-28090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 4s
      retries: 2
      start_period: 30s
      start_interval: 1s

  loki:
    image: grafana/loki:3.5.5
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
    ports:
      - "127.0.0.1:${HUGO_TESTBED_LOKI_PORT:-28100}:3100"

  loki-seed:
    image: python:3.12.15-alpine3.24
    depends_on:
      loki:
        condition: service_started
    environment:
      LOKI_URL: http://loki:3100
      LOKI_TENANT: hugo-testbed
    volumes:
      - ./seed.py:/seed/seed.py:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - python -I /seed/seed.py loki && touch /tmp/seeded && exec sleep infinity
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/seeded"]
      interval: 5s
      timeout: 4s
      retries: 2
      start_period: 120s
      start_interval: 1s

  opensearch:
    image: opensearchproject/opensearch:2.19.3
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "false"
    ports:
      - "127.0.0.1:${HUGO_TESTBED_OPENSEARCH_PORT:-28992}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=1s' > /dev/null"]
      interval: 5s
      timeout: 4s
      retries: 2
      start_period: 180s
      start_interval: 1s

  opensearch-seed:
    image: python:3.12.15-alpine3.24
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_URL: http://opensearch:9200
    volumes:
      - ./seed.py:/seed/seed.py:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - python -I /seed/seed.py opensearch && touch /tmp/seeded && exec sleep infinity
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/seeded"]
      interval: 5s
      timeout: 4s
      retries: 2
      start_period: 120s
      start_interval: 1s
