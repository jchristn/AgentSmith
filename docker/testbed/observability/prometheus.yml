# Prometheus for the Hugo observability testbed: scrapes itself every 5 seconds and evaluates testbed-rules.yml.
global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    testbed: hugo

rule_files:
  - /etc/prometheus/testbed-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
        labels:
          env: testbed
  # A target that never answers, so prom_targets has a down target to report.
  - job_name: unreachable
    scrape_timeout: 1s
    static_configs:
      - targets: ["127.0.0.1:9"]
