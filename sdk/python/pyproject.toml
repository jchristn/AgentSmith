[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hugo-sdk"
version = "0.1.0-alpha"
description = "Python SDK for Hugo, the multi-tenant super agent server (sync and async clients on httpx)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Joel Christner" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.25"]

[project.optional-dependencies]
test = ["pytest>=7.4", "pytest-asyncio>=0.23"]

[project.urls]
Homepage = "https://github.com/jchristn/AgentSmith"

[tool.setuptools]
packages = ["hugo_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
